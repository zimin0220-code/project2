 CSS와 JS 파일을 연결하는 코드가 포함되어 있습니다.

```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 반 행복 공간 🏫</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🏫 우리 반 행복 공간</h1>
        <p>사진을 공유하고, 자유롭게 이야기를 나누는 우리들만의 공간입니다.</p><h2>✍️ 오늘의 이야기 & 사진 올리기</h2>
            <input type="text" id="post-author" placeholder="작성자 이름 (예: 홍길동)">
            <textarea id="post-content" placeholder="친구들과 나누고 싶은 이야기를 적어주세요."></textarea>
            <div>
                <label for="post-file" class="file-label">📸 사진 첨부 (선택):</label>
                <input type="file" id="post-file" accept="image/*">
            </div>
            <button onclick="addPost()">등록하기</button>
        </section>

        <!-- 게시판 목록 섹션 -->
        <section id="board-section">
            <h2>📋 우리 반 게시판</h2>
            <ul id="post-list" class="post-list">
                <!-- 게시글 동적 추가 위치 -->
            </ul>
        </section>

        <!-- 한줄 의견 공유 섹션 -->
        <section id="opinion-section">
            <h2>💬 실시간 한줄 의견</h2>
            <div class="opinion-form">
                <input type="text" id="opinion-author" placeholder="이름" class="input-name">
                <input type="text" id="opinion-input" placeholder="한줄 의견을 남겨주세요!" class="input-text">
                <button onclick="addOpinion()">남기기</button>
            </div>
            <ul id="opinion-list" class="opinion-list">
                <!-- 의견 동적 추가 위치 -->
            </ul>
        </section>
    </main>

    <!-- JS 파일 연결 -->
    <script src="script.js"></script>
</body>
</html>
